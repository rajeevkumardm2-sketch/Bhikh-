<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Creative Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 27, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-primary: #8a2be2;
            --accent-glow: #00f2fe;
            --text-main: #f0f3f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 10px;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(138, 43, 226, 0.2);
            text-align: center;
        }

        /* Music Player Bar */
        .music-player-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            overflow: hidden;
        }

        .music-icon {
            font-size: 1.2rem;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; color: var(--accent-glow); }
        }

        .play-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-glow));
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .music-upload-btn {
            font-size: 0.75rem;
            color: var(--accent-glow);
            text-decoration: underline;
            cursor: pointer;
            display: block;
            margin-top: -15px;
            margin-bottom: 20px;
        }

        /* Header */
        .badge {
            display: inline-block;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.4);
            color: #d8b4fe;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Amount Presets Grid */
        .amount-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: left;
        }

        .amount-chips {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .chip:hover, .chip.active {
            background: rgba(138, 43, 226, 0.3);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            color: #fff;
        }

        /* Custom Input */
        .custom-amount-wrap {
            position: relative;
            margin-bottom: 24px;
        }

        .custom-amount-wrap input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px 12px 35px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .custom-amount-wrap input:focus {
            border-color: var(--accent-glow);
        }

        .currency-symbol {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: 600;
        }

        /* QR Code Container */
        .qr-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            position: relative;
        }

        #qrcode img, #qrcode canvas {
            margin: 0 auto;
            display: block;
        }

        /* UPI Copy Box */
        .upi-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .upi-id-text {
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--accent-glow);
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Direct Payment Buttons */
        .pay-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .pay-app-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .pay-app-btn:hover {
            border-color: var(--accent-glow);
            background: rgba(138, 43, 226, 0.2);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #audio-element {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="container">
        
        <!-- Music Player Widget -->
        <div class="music-player-card">
            <div class="music-info">
                <span class="music-icon">🎵</span>
                <span id="music-title">Atmospheric Soundscape</span>
            </div>
            <button class="play-btn" id="play-pause-btn" onclick="toggleMusic()">Play 🎧</button>
        </div>

        <label for="music-file-input" class="music-upload-btn">📁 Click to upload your own Music file</label>
        <input type="file" id="music-file-input" accept="audio/*" style="display: none;" onchange="handleMusicUpload(event)">

        <span class="badge">Support & Contribution</span>
        <h1>Support My Work</h1>
        <p class="subtitle">If you appreciate this work and want to support the journey, feel free to contribute any amount!</p>

        <!-- Amount Selection (1, 5, 10, 20, 50, 100) -->
        <div class="amount-title">Select Amount (₹)</div>
        <div class="amount-chips">
            <button class="chip active" onclick="selectAmount(1, this)">₹1</button>
            <button class="chip" onclick="selectAmount(5, this)">₹5</button>
            <button class="chip" onclick="selectAmount(10, this)">₹10</button>
            <button class="chip" onclick="selectAmount(20, this)">₹20</button>
            <button class="chip" onclick="selectAmount(50, this)">₹50</button>
            <button class="chip" onclick="selectAmount(100, this)">₹100</button>
        </div>

        <!-- Custom Amount Input -->
        <div class="custom-amount-wrap">
            <span class="currency-symbol">₹</span>
            <input type="number" id="custom-amount" placeholder="Or enter custom amount" oninput="handleCustomAmount(this.value)">
        </div>

        <!-- QR Code Display -->
        <div class="qr-card">
            <div id="qrcode"></div>
        </div>

        <!-- Copy UPI ID Box -->
        <div class="upi-box">
            <span class="upi-id-text" id="upi-id-display">7779996860-1@nyes</span>
            <button class="copy-btn" id="copy-btn" onclick="copyUpiId()">Copy ID</button>
        </div>

        <!-- Direct UPI App Links -->
        <div class="pay-links">
            <a href="#" id="gpay-link" class="pay-app-btn" target="_blank">
                <span>⚡ GPay</span>
            </a>
            <a href="#" id="phonepe-link" class="pay-app-btn" target="_blank">
                <span>🟣 PhonePe</span>
            </a>
            <a href="#" id="paytm-link" class="pay-app-btn" target="_blank">
                <span>🔵 Paytm</span>
            </a>
        </div>

        <footer>
            🔒 100% Secure & Direct UPI Payment
        </footer>
    </div>

    <!-- Background Audio Element -->
    <audio id="audio-element" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ambient-piano-amp-strings-10711.mp3"></audio>

    <script>
        // CONFIGURATION
        const CONFIG = {
            upiId: "7779996860-1@nyes",
            payeeName: "Creative Work Support",
            defaultAmount: 1
        };

        let currentAmount = CONFIG.defaultAmount;
        let qrCodeInstance = null;
        const audioElement = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-pause-btn');

        // Initialize QR Code & Links
        window.onload = function() {
            updatePaymentDetails(currentAmount);
            initParticles();
        };

        function generateUpiUrl(amount) {
            return `upi://pay?pa=${CONFIG.upiId}&pn=${encodeURIComponent(CONFIG.payeeName)}&am=${amount}&cu=INR`;
        }

        function updatePaymentDetails(amount) {
            currentAmount = amount;
            const upiUrl = generateUpiUrl(amount);

            // Update QR Code
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            qrCodeInstance = new QRCode(qrContainer, {
                text: upiUrl,
                width: 170,
                height: 170,
                colorDark: "#0b0d19",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Update App Links
            document.getElementById('gpay-link').href = upiUrl;
            document.getElementById('phonepe-link').href = upiUrl;
            document.getElementById('paytm-link').href = upiUrl;
        }

        function selectAmount(amount, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('custom-amount').value = '';
            updatePaymentDetails(amount);
        }

        function handleCustomAmount(value) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const val = parseFloat(value);
            if (!isNaN(val) && val > 0) {
                updatePaymentDetails(val);
            } else {
                updatePaymentDetails(CONFIG.defaultAmount);
            }
        }

        function copyUpiId() {
            navigator.clipboard.writeText(CONFIG.upiId);
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.innerText = 'Copied! ✓';
            copyBtn.style.background = '#00f2fe';
            copyBtn.style.color = '#000';
            setTimeout(() => {
                copyBtn.innerText = 'Copy ID';
                copyBtn.style.background = 'rgba(255, 255, 255, 0.1)';
                copyBtn.style.color = '#fff';
            }, 2000);
        }

        // Music Handlers
        function toggleMusic() {
            if (audioElement.paused) {
                audioElement.play();
                playBtn.innerText = 'Pause ⏸';
                playBtn.style.background = '#ff0055';
            } else {
                audioElement.pause();
                playBtn.innerText = 'Play 🎧';
                playBtn.style.background = 'linear-gradient(135deg, var(--accent-primary), var(--accent-glow))';
            }
        }

        function handleMusicUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                audioElement.src = objectUrl;
                document.getElementById('music-title').innerText = file.name;
                audioElement.play();
                playBtn.innerText = 'Pause ⏸';
            }
        }

        // Background Particle Animation
        function initParticles() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const particles = [];
            const particleCount = 45;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 242, 254, ${p.alpha})`;
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
